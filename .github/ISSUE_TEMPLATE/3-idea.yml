name: An idea
description: A new card type, a new effect, something that could be easier, or a build for another system.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: Say what it should do, and what it would help make.
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Pictures
      description: A sketch, a screenshot from the game, or a card from another mod helps show it.
