name: Something isn't working
description: A button does nothing, a card looks wrong, or the app closes by itself.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version on the download, such as v0.1.0. Leave it empty if unsure.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Say what went wrong and what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a new joker
        2. Load a picture
        3. Click ...
  - type: textarea
    id: files
    attributes:
      label: Screenshots and files
      description: Drag in a screenshot here. To share a .jkr or .jkrp file, put it in a zip first, because GitHub only takes some kinds of file.
