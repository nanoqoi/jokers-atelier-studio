name: The app won't install or open
description: The download, the installer or the first launch goes wrong.
labels: [install]
body:
  - type: markdown
    attributes:
      value: |
        The first time it runs, Windows warns about the app because it isn't signed yet. On "Windows protected your PC", click **More info**, then **Run anyway**. If it still won't open, fill this in.
  - type: dropdown
    id: system
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Copy any message word for word, or drag in a screenshot of it.
    validations:
      required: true
