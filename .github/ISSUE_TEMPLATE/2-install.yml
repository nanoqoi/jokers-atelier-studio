name: The app won't install or open
description: The download, the installer or the first launch goes wrong.
labels: [install]
body:
  - type: markdown
    attributes:
      value: |
        The first time it opens, the computer warns about the app because it isn't signed yet. The [README](https://github.com/nanoqoi/jokers-atelier-studio#download-and-install) shows how to get past that warning on each computer. If it still won't open, fill this in.
  - type: dropdown
    id: system
    attributes:
      label: Computer
      options:
        - Windows 11
        - Windows 10
        - Mac with an Apple chip
        - Mac with an Intel chip
        - Linux (AppImage)
        - Linux (.deb)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      description: For example macOS 15, Ubuntu 24.04 or Windows 11 24H2. Leave it empty if unsure.
  - type: input
    id: file
    attributes:
      label: Which file was downloaded?
      placeholder: Jokers-Atelier-Studio-Windows-Setup.exe
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Copy any message word for word, or drag in a screenshot of it.
    validations:
      required: true
